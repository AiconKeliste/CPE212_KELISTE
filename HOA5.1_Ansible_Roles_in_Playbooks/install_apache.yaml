#Task 1
---
- hosts: all
  become: true
  tasks:

  - name: Update repository index
    apt:
        update_cache: yes
    when: ansible_distribution == "Ubuntu"

  - name: install apache2 package
    apt:
        name: apache2
        state: latest
    when: ansible_distribution == "Ubuntu"

  - name: add PHP support for apache
    apt:
        name: libapache2-mod-php
        state: latest
    when: ansible_distribution == "Ubuntu"

  - name: Update repository index
    dnf:
        update_cache: yes
    when: ansible_distribution == "CentOS"

  - name: install apache2 package
    dnf:
        name: httpd
        state: latest
    when: ansible_distribution == "CentOS"
# Task 2
---
- hosts: all
  become: true
  tasks:

  - name: install apache2 and php packages for Ubuntu
    apt:
        name:
          - apache2
          - libapache2-mod-php
        state: latest
        update_cache: yes
    when: ansible_distribution == "Ubuntu"

  - name: install apache2 and php packages for CentOS
    dnf:
        name:
          - httpd
          - php
        state: latest
        update_cache: yes
    when: ansible_distribution == "CentOS"
# Task 3
---
- hosts: all
  become: true
  tasks:

  - name: install apache2 and php packages
    package:
        name:
          - "{{ apache_package }}"
          - "{{ php_package }}"
        state: latest
        update_cache: yes
